<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fluffy Pet</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#bde9ff,#e9f8ff);min-height:100vh;display:grid;place-items:center;color:#453b35}.room{width:min(900px,96vw);height:min(720px,94vh);position:relative;overflow:hidden;border:8px solid #fff;border-radius:30px;background:linear-gradient(#c9efff 0 67%,#a8dc83 67%);box-shadow:0 15px 45px #6b8b9955}.rug{position:absolute;width:55%;height:90px;left:22%;bottom:55px;background:#f4c4d7;border-radius:50%;box-shadow:inset 0 0 0 8px #fff7}.pet{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);width:260px;height:300px;transition:.3s}.pet.sleeping{transform:translate(-50%,-50%) rotate(-3deg)}svg{width:100%;height:100%}.mouthOpen{display:none}.pet.eating .mouthClosed{display:none}.pet.eating .mouthOpen{display:block}.pet.petting .openEyes{display:none}.pet.petting .closedEyes{display:block}.closedEyes{display:none}.buttons{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:95%}button{border:0;border-radius:18px;padding:12px 18px;background:#fff;box-shadow:0 4px 12px #0002;font-size:16px;cursor:pointer}.mainbtn{background:#ffb7d0;font-weight:700}.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,92%);max-height:75%;overflow:auto;background:#ffffffee;border-radius:24px;padding:20px;z-index:10;box-shadow:0 15px 50px #0003}.hidden{display:none}.foodgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.food{height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center}.food b{font-size:34px}.drag{position:fixed;z-index:50;pointer-events:none;font-size:42px}.status{text-align:center;font-weight:700;margin:8px}.bathroom{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#eef5f8 0 58px,#d9e6eb 59px 60px),repeating-linear-gradient(0deg,transparent 0 58px,#d9e6eb 59px 60px);z-index:20}.bathHeader{height:60px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700}.tub{position:absolute;width:330px;height:210px;left:50%;top:54%;transform:translate(-50%,-50%);background:#fff;border:8px solid #d8d8d8;border-radius:35px 35px 70px 70px;box-shadow:0 20px 25px #0002}.water{position:absolute;inset:35px 10px 10px;background:#8ed9f0;border-radius:25px 25px 55px 55px}.bathCat{position:absolute;width:210px;height:240px;left:50%;top:45%;transform:translate(-50%,-50%);z-index:2}.tools{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:5}.tool{font-size:28px}.count{position:absolute;top:80px;right:20px;background:#fff;border-radius:50%;width:70px;height:70px;display:grid;place-items:center;font-size:30px;font-weight:800;z-index:6}.msg{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#fff;padding:10px 16px;border-radius:15px;z-index:7}.towel{background:#ff9fca}.small{font-size:13px;color:#665}
@media(max-width:500px){.foodgrid{grid-template-columns:repeat(2,1fr)}.pet{width:220px;height:260px}.tub{width:290px}.bathCat{width:185px;height:215px}}
</style></head><body>
<div class="room" id="main"><div class="rug"></div>
<div class="pet" id="pet"><svg viewBox="0 0 260 300"><ellipse cx="130" cy="185" rx="85" ry="105" fill="#f2c8a0"/><path d="M65 105L55 25l65 58zm130 0l10-80-65 58z" fill="#eab58a" stroke="#9b765b" stroke-width="5"/><ellipse cx="130" cy="105" rx="82" ry="75" fill="#f4d0a8" stroke="#9b765b" stroke-width="5"/><g class="openEyes"><circle cx="100" cy="103" r="7"/><circle cx="160" cy="103" r="7"/></g><g class="closedEyes"><path d="M90 103q10 10 20 0M150 103q10 10 20 0" fill="none" stroke="#493b35" stroke-width="5" stroke-linecap="round"/></g><path d="M116 128q14-10 28 0q-14 12-28 0" fill="#5a4037"/><g class="mouthClosed"><path d="M130 132q-10 15-22 5m22-5q10 15 22 5" fill="none" stroke="#5a4037" stroke-width="4"/></g><g class="mouthOpen"><ellipse cx="130" cy="143" rx="30" ry="23" fill="#4b2b2b"/><path d="M112 155q18-14 36 0q-18 15-36 0" fill="#f58ba4"/></g><path d="M45 135h55m-55 18h55m115-18h-55m55 18h-55" stroke="#9b765b" stroke-width="3"/><path d="M55 205q-55 30-20 80" fill="none" stroke="#9b765b" stroke-width="20" stroke-linecap="round"/></svg></div>
<div class="buttons"><button class="mainbtn" onclick="feedMenu()">Покормить</button><button class="mainbtn" onclick="petMode()">Погладить</button><button class="mainbtn" onclick="sleep()">Спать</button><button class="mainbtn" onclick="bath()">Купать</button></div>
<div class="panel hidden" id="food"><h2>Еда для кошки</h2><div class="small">Перетащи выбранную еду к её рту.</div><div class="foodgrid">
<button class="food" onclick="pick('🐱🥫')"><b>🐱🥫</b>Влажный корм</button><button class="food" onclick="pick('🥣')"><b>🥣</b>Сухой корм</button><button class="food" onclick="pick('💧')"><b>💧</b>Вода</button><button class="food" onclick="pick('🍗')"><b>🍗</b>Курица</button><button class="food" onclick="pick('🐟')"><b>🐟</b>Рыба</button><button class="food" onclick="pick('🌽')"><b>🌽</b>Кукуруза</button><button class="food" onclick="pick('🌴')"><b>🌴</b>Финик</button><button class="food" onclick="pick('🍎')"><b>🍎</b>Яблоко</button><button class="food" onclick="pick('🥕')"><b>🥕</b>Морковь</button></div><button onclick="closePanel()">Закрыть</button></div>
<div class="status" id="status"></div></div>
<div class="bathroom hidden" id="bath"><div class="bathHeader">Купание <button onclick="closeBath()">✕</button></div><div class="msg" id="bathMsg">Возьми дуршлаг и мой голову 10 секунд</div><div class="count hidden" id="count">10</div><div class="tub"><div class="water"></div></div><div class="bathCat" id="bathCat"></div><div class="tools"><button class="tool" onpointerdown="washStart(event)" onpointerup="washEnd()">🥣 Дуршлаг</button><button class="tool towel hidden" id="towel" onpointerdown="dryStart(event)" onpointerup="dryEnd()">🩷 Полотенце</button></div></div>
<script>
const pet=document.getElementById('pet'),status=document.getElementById('status');let timer=null,mode='',start=0,drag=null;
function feedMenu(){document.getElementById('food').classList.remove('hidden')}
function closePanel(){document.getElementById('food').classList.add('hidden')}
function pick(x){closePanel();drag=document.createElement('div');drag.className='drag';drag.textContent=x;document.body.appendChild(drag);status.textContent='Перетащи к мордочке';function mv(e){drag.style.left=e.clientX+'px';drag.style.top=e.clientY+'px'}function up(e){document.removeEventListener('pointermove',mv);drag.remove();if(e.clientX>innerWidth*.38&&e.clientX<innerWidth*.62&&e.clientY>innerHeight*.25&&e.clientY<innerHeight*.55){pet.classList.add('eating');status.textContent='Ням-ням!';setTimeout(()=>pet.classList.remove('eating'),900)}else status.textContent='Попробуй ещё раз';}document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up,{once:true})}
function petMode(){status.textContent='Проведи пальцем по голове кошки';pet.classList.add('petting');let n=0;function end(){pet.classList.remove('petting');document.removeEventListener('pointermove',move);status.textContent=n>70?'Кошке нравится!':'Погладь её ещё';}function move(e){n++;if(n>70)status.textContent='Мур-мур...'}document.addEventListener('pointermove',move);document.addEventListener('pointerup',end,{once:true})}
function sleep(){pet.classList.add('sleeping');status.textContent='Ззз...';setTimeout(()=>{pet.classList.remove('sleeping');status.textContent='Кошка проснулась'},3700)}
function bath(){document.getElementById('bath').classList.remove('hidden');document.getElementById('bathCat').innerHTML=pet.innerHTML}
function closeBath(){document.getElementById('bath').classList.add('hidden');clearInterval(timer);document.getElementById('count').classList.add('hidden')}
function run(seconds,done){let left=seconds,c=document.getElementById('count');c.classList.remove('hidden');c.textContent=left;clearInterval(timer);timer=setInterval(()=>{left--;c.textContent=left;if(left<=0){clearInterval(timer);done()}},1000)}
function washStart(e){e.preventDefault();if(mode)return;mode='wash';document.getElementById('bathMsg').textContent='Мой голову...';run(10,()=>{mode='';document.getElementById('towel').classList.remove('hidden');document.getElementById('bathMsg').textContent='Готово! Теперь возьми розовое полотенце'})}
function washEnd(){if(mode==='wash'&&document.getElementById('count').textContent!=='0'){clearInterval(timer);document.getElementById('count').classList.add('hidden');mode='';document.getElementById('bathMsg').textContent='Нужно держать дуршлаг 10 секунд'}}
function dryStart(e){e.preventDefault();if(mode)return;mode='dry';document.getElementById('bathMsg').textContent='Вытираем...';run(3,()=>{mode='';document.getElementById('bathMsg').textContent='Готово!';setTimeout(closeBath,900)})}
function dryEnd(){if(mode==='dry'&&document.getElementById('count').textContent!=='0'){clearInterval(timer);document.getElementById('count').classList.add('hidden');mode='';document.getElementById('bathMsg').textContent='Нужно держать полотенце 3 секунды'}}
</script></body></html>
