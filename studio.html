<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Картины ChatJAMI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0c0d13;color:#f2f3f8;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}svg{display:block}
.w{max-width:960px;margin:0 auto;padding:0 16px 48px}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;max-width:960px;margin:0 auto}.lg{width:36px;height:36px}
.brand{font-size:20px;line-height:1;flex:1}.brand b{font-weight:800;background:linear-gradient(90deg,#38bdf8,#8b5cf6,#ec4899,#38bdf8);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 6s linear infinite}.brand small{display:block;font-size:12px;color:#9aa0b4;margin-top:4px}
@keyframes sh{to{background-position:200% 0}}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#cfd3e4}.ib:hover{background:#ffffff1a}.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:clamp(26px,5vw,38px);line-height:1.15;margin:8px 0 6px;letter-spacing:-.5px}.sub{color:#9aa0b4;margin:0 0 18px}
.rs{display:none;background:#161822;border:1px solid #262a38;border-radius:22px;padding:14px;margin-bottom:22px;box-shadow:0 10px 34px #0007}
.fr{position:relative;border-radius:16px;overflow:hidden;background:#0c0d13;min-height:240px;display:grid;place-items:center}
.fr img{display:block;width:100%;height:auto;filter:blur(26px);transform:scale(1.06);transition:filter 1s ease,transform 1s ease}.fr img.on{filter:none;transform:none}
.ld{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:linear-gradient(110deg,transparent 30%,#8278ff40 50%,transparent 70%),#0c0d13;background-size:200% 100%;animation:sk 1.4s linear infinite;transition:opacity .5s}.ld.off{opacity:0;pointer-events:none}
@keyframes sk{to{background-position:-200% 0}}
.sp{width:36px;height:36px;border:3px solid #262a38;border-top-color:#8b5cf6;border-radius:50%;animation:rot .8s linear infinite;margin:0 auto 14px}@keyframes rot{to{transform:rotate(360deg)}}
.bar{height:6px;border-radius:99px;background:#262a38;overflow:hidden;width:min(260px,70vw);margin:12px auto 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#8b5cf6,#ec4899);border-radius:99px}
.rt{font-weight:700;margin:12px 2px 0}.ac{display:none;gap:10px;margin-top:12px;flex-wrap:wrap}.ac button{flex:1;min-width:130px;padding:12px;border-radius:14px;font-weight:700;border:1px solid #262a38}.ac .pr{border:0;color:#fff;background:linear-gradient(135deg,#38bdf8,#6d5dfc 55%,#c04cf0)}
.lb{font-weight:600;margin:4px 0 12px}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:720px){.gr{grid-template-columns:repeat(3,1fr);gap:14px}}
.cd{position:relative;min-height:96px;border-radius:18px;padding:14px;text-align:left;font-weight:700;font-size:16px;line-height:1.25;color:#fff;display:flex;align-items:flex-end;overflow:hidden;box-shadow:0 8px 22px #0006;transition:transform .2s,box-shadow .2s,opacity .2s;animation:fi .5s both}.cd:hover{transform:translateY(-3px)}.cd:disabled{opacity:.45;cursor:wait;transform:none}.cd.on{outline:3px solid #fff}
.cd:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,#fff4,transparent 45%)}.cd span{position:relative;text-shadow:0 1px 6px #0007}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.ft{margin-top:26px;text-align:center;color:#7c8196;font-size:12px}
</style></head><body>
<header><button class="ib" id="bk" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
<svg class="lg" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><path d="M20 3C10.6 3 3 10 3 18.6c0 4.6 2.2 8.7 5.7 11.5L7.5 36.2c-.2.9.8 1.6 1.6 1.1l6.6-3.7c1.3.3 2.8.5 4.3.5 9.4 0 17-7 17-15.5S29.4 3 20 3z" fill="#0b0b14" stroke="url(#a)" stroke-width="1.6"/><g transform="translate(1.5 -.5)"><g transform="rotate(18 20 19)"><path d="M23 9.5v12.2c0 3.2-2.4 5.3-5.6 5.3-1.4 0-2.6-.4-3.6-1.1" fill="none" stroke="url(#b)" stroke-width="3.6" stroke-linecap="round"/></g><circle cx="11.5" cy="15.2" r="2.7" fill="#fff"/></g></svg>
<div class="brand">Chat<b>JAMI</b> Картины<small>Выбери, что создать</small></div></header>
<div class="w"><h1>Что создать?</h1><p class="sub">Нажми на картину, и она будет готова через несколько секунд.</p>
<div class="rs" id="rs"><div class="fr" id="fr"><div class="ld" id="ld"><div><div class="sp"></div><div id="lt">Готовлю картину…</div><div class="bar"><i id="pg"></i></div></div></div></div><div class="rt" id="rt"></div>
<div class="ac" id="ac"><button class="pr" id="dl">Скачать</button><button id="mr">Выбрать другую</button></div><div class="ft" id="hn" style="display:none;text-align:left"></div></div>
<div class="lb">Какие картины можно создать</div><div class="gr" id="gr"></div>
<div class="ft">10 готовых картин ChatJAMI</div></div>
<script>
var $=function(i){return document.getElementById(i)};
var BRIDGE=false,DUR=[9000,11000];
var L=[['rainbow','Домики под радугой','linear-gradient(135deg,#4facfe,#f093fb)'],['mosque','Мечеть на закате','linear-gradient(135deg,#ff7e5f,#6a3093)'],['deer','Олень в туманном лесу','linear-gradient(135deg,#355c4a,#a8c0b4)'],['castle','Замок на холме','linear-gradient(135deg,#f6a04d,#7b4fc9)'],['meadow','Луг с бабочками','linear-gradient(135deg,#43c59e,#f9d423)'],['space','Космос','linear-gradient(135deg,#0f0c29,#6a3de8)'],['city','Ночной город у реки','linear-gradient(135deg,#141e30,#e0a030)'],['lighthouse','Маяк у моря','linear-gradient(135deg,#fd746c,#2b6cb0)'],['mountains','Горы на закате','linear-gradient(135deg,#ff512f,#f09819)'],['cat','Кот и дождь за окном','linear-gradient(135deg,#485563,#d9a066)']];
var P=L.map(function(p){return{n:p[0],t:p[1],g:p[2],u:'pictures/'+p[0]+'.jpg'}}),cur=-1,busy=false,tk=0,pend=null;
function build(){var g=$('gr');g.innerHTML='';P.forEach(function(p,i){var b=document.createElement('button');b.className='cd';b.style.background=p.g;b.style.animationDelay=(i*50)+'ms';
  var s=document.createElement('span');s.textContent=p.t;b.appendChild(s);b.onclick=function(){pick(i)};g.appendChild(b)});lock(false)}
function lock(on){[].forEach.call($('gr').children,function(b,i){b.disabled=on;b.className='cd'+(i===cur?' on':'')})}
function sc(e){try{e.scrollIntoView({behavior:'smooth',block:'center'})}catch(_){}}
function pick(i){if(busy)return;busy=true;cur=i;var p=P[i],f=$('fr');
  $('rs').style.display='block';$('ac').style.display='none';$('rt').textContent=p.t;lock(true);
  var old=f.querySelector('img');if(old)old.remove();var ld=$('ld');ld.className='ld';$('pg').style.width='0';$('lt').textContent='Готовлю картину…';sc($('rs'));
  var t0=Date.now(),D=DUR[0]+Math.random()*(DUR[1]-DUR[0]);
  clearInterval(tk);tk=setInterval(function(){var k=Math.min(1,(Date.now()-t0)/D);$('pg').style.width=Math.round(k*100)+'%';$('lt').textContent=k<.7?'Готовлю картину…':'Почти готово…';
    if(k>=1&&p.u){clearInterval(tk);done(p)}},100)}
function done(p){var f=$('fr'),im=document.createElement('img');im.alt=p.t;im.onload=function(){f.appendChild(im);$('ld').className='ld off';setTimeout(function(){im.className='on'},30);$('ac').style.display='flex';busy=false;lock(false);sc($('rs'))};
  im.onerror=function(){$('lt').textContent='Не удалось показать картину. Выбери ещё раз.';busy=false;lock(false)};im.src=p.u}
function toBtn(t){var b=$('dl');b.textContent=t;clearTimeout(toBtn.t);toBtn.t=setTimeout(function(){b.textContent='Скачать'},2800)}
function hint(t){var h=$('hn');h.textContent=t||'';h.style.display=t?'block':'none'}
$('dl').onclick=function(){if(cur<0)return;var p=P[cur],name='chatjami-'+p.n+'.jpg';hint('');
  if(!BRIDGE){var a=document.createElement('a');a.href=p.u;a.download=name;document.body.appendChild(a);a.click();a.remove();toBtn('Скачивание…');return}
  var id=Date.now()+Math.random(),to=setTimeout(function(){rm();hint('Нет ответа от окна Claude. Попробуй ещё раз.')},90000);
  function rm(){clearTimeout(to);removeEventListener('message',on)}
  function on(e){var m=e.data;if(!m||m.id!==id||(m.saved===undefined&&!m.error))return;rm();
    if(m.saved)toBtn('Сохранено');else if(m.error==='declined')toBtn('Отменено');
    else hint('Скачивание недоступно в этом окне Claude. Открой страницу в браузере (три точки, «Открыть в браузере») и нажми «Скачать» снова.')}
  addEventListener('message',on);toBtn('Подтверди сохранение…');parent.postMessage({type:'studio-download',id:id,filename:name,data:p.u},'*')};
$('mr').onclick=function(){sc($('gr'))};
$('bk').onclick=function(){if(parent!==window)parent.postMessage('studio-close','*');else location.href='index.html'};
build();
if(BRIDGE){P.forEach(function(p){p.u=''});var id=Date.now()+Math.random();
  addEventListener('message',function(e){var m=e.data;if(!m||m.id!==id||!m.items)return;m.items.forEach(function(it,i){if(P[i])P[i].u=it.u})});
  parent.postMessage({type:'studio-gallery',id:id},'*')}
</script></body></html>
