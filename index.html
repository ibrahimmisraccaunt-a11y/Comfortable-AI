<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#7b61ff"><title>Comfortable AI</title><link rel="stylesheet" href="style.css?v=26"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-logo">C</div><div><div class="brand-title">Comfortable AI</div><div class="brand-subtitle">уютный помощник</div></div></div><button id="newChatButton" class="primary-button">Новый чат</button><div class="sidebar-section-title">Чаты</div><div id="chatList" class="chat-list"></div><div class="sidebar-bottom"><button id="nameButton" class="secondary-button"> Имя</button><button id="backgroundButton" class="secondary-button"> Фон</button><button id="voiceButton" class="secondary-button"> Голос</button></div></aside><main class="main"><header class="topbar"><div><h1 id="chatTitle">Новый чат</h1><div class="online">Готов к общению</div></div><button id="renameChatButton" class="icon-button" title="Переименовать чат">Переименовать</button></header><section class="welcome-card"><div><h2>Ассаляму алейкум уа рахматуллахи уа баракатух! </h2><p>Я помогу поговорить, придумать историю или загадку, а ещё могу подсказать.</p></div></section><section id="messages" class="messages" aria-live="polite"></section><section class="help-section"><div class="section-heading"><div><h3>Чем могу помочь?</h3><p>Выбери карточку или напиши что-нибудь сама.</p></div></div><div class="help-grid"><button class="help-card" data-action="talk"><span></span><b>Поговорить</b><small>Начать обычный разговор</small></button><button class="help-card" data-action="riddle"><span></span><b>Загадка</b><small>Попробуй отгадать</small></button><button class="help-card" data-action="story"><span></span><b>История</b><small>Придумаем сказку</small></button><button class="help-card" data-action="help"><span></span><b>Подсказка</b><small>Подскажу без спойлера</small></button></div></section><div class="quick-actions"><button data-text="Дай загадку">Загадка</button><button data-text="Дай подсказку">Подсказка</button><button data-text="Я сдаюсь">Я сдаюсь</button></div><form id="composer" class="composer"><input id="messageInput" type="text" placeholder="Напиши сообщение…" autocomplete="off"><button type="submit" class="send-button">Отправить</button></form></main></div><input id="backgroundInput" type="file" accept="image/*" hidden><div id="voicePanel" class="modal hidden" aria-hidden="true"><div class="modal-card"><div class="modal-head"><h3>Озвучка ответов</h3><button id="closeVoice" class="icon-button">Закрыть</button></div><label class="switch-row"><span> Включить голос</span><input id="voiceEnabled" type="checkbox"></label><div class="voice-options"><button data-voice="female">Женский</button><button data-voice="male">Мужской</button><button data-voice="child">Детский</button></div><button id="testVoice" class="primary-button wide">Проверить голос</button></div></div><div id="backgroundPanel" class="modal hidden" aria-hidden="true"><div class="modal-card"><div class="modal-head"><h3>Фон чата</h3><button id="closeBackground" class="icon-button">Закрыть</button></div><div class="preset-grid"><button data-bg="lavender"> Лавандовый</button><button data-bg="sunset"> Закат</button><button data-bg="ocean"> Океан</button><button data-bg="mint"> Мятный</button><button data-bg="pink"> Розовый</button><button data-bg="sky"> Небесный</button></div><button id="uploadBackground" class="secondary-button wide">Моя картинка</button><button id="resetBackground" class="secondary-button wide">Вернуть фон</button></div></div><script src="script.js?v=28"></script></body></html>
