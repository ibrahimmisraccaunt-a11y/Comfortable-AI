.mb{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}.mb.col{flex-direction:column;gap:0}

var API='https://comfortable-ai-proxy.YOUR-SUBDOMAIN.workers.dev'; // адрес вашего Worker после деплоя
async function generate(msgs,ins,onText,persona,opt){

function cnorm(s){return String(s).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function cityMethod(cc){return cc==='EG'?'egypt':cc==='SA'?'makkah':'mwl'}
function cityOffline(q){var n=cnorm(q);if(n.length<2)return[];var out=[];
  PCITIES.forEach(function(x){var a=cnorm(x[1]);if(a.indexOf(n)>=0)out.push({s:a.indexOf(n)===0?0:1,name:x[1],where:'',lat:x[2],lng:x[3],tz:x[4],cc:''})});
  WX.concat(WC).forEach(function(x){var a=cnorm(x[0]),b=cnorm(x[1]),i=Math.min(a.indexOf(n)<0?99:a.indexOf(n),b.indexOf(n)<0?99:b.indexOf(n));
    if(i<99)out.push({s:i===0?0:1,name:x[0],where:CCN[x[2]]||x[2],lat:x[3],lng:x[4],tz:x[5],cc:x[2]})});
  var seen={};return out.filter(function(r){var k=cnorm(r.name)+Math.round(r.lat);if(seen[k])return false;seen[k]=1;return true}).sort(function(a,b){return a.s-b.s||a.name.length-b.name.length}).slice(0,8)}
async function cityOnline(q){try{var ac=new AbortController(),t=setTimeout(function(){ac.abort()},4000);
  var r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=8&language=ru&format=json&name='+encodeURIComponent(q),{signal:ac.signal});clearTimeout(t);if(!r.ok)return[];

function qiblaCalc(c){var R=Math.PI/180,f1=c.lat*R,f2=21.4225*R,dl=(39.8262-c.lng)*R;

  return{deg:(Math.atan2(y,x)/R+360)%360,km:2*6371*Math.asin(Math.sqrt(h))}}

function copyText(s){var done=function(){toast('Скопировано')};
  function fb(){var ta=document.createElement('textarea');ta.value=s;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(_){toast('Не удалось скопировать')}ta.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(done,fb);else fb()}
function regen(c){var l=c.msgs[c.msgs.length-1],p=c.msgs[c.msgs.length-2];
  if(c.busy||!l||l.role!=='assistant'||!p||p.role!=='user')return;
  c.regen={m:l,ins:c.ins||0};if(l.hit)c.ins=Math.max(0,(c.ins||0)-1);c.msgs.pop();renderChat();reply(c)}
function actRow(m){var c=cur(),r=document.createElement('div');r.className='act';
  var b=document.createElement('button');b.innerHTML=IC.copy+(m.project?'Копировать ссылку':'Копировать');b.onclick=function(){copyText(m.project?m.project.url:m.content)};r.appendChild(b);
  var l=c&&c.msgs[c.msgs.length-1]===m,p=c&&c.msgs[c.msgs.length-2];
  if(l&&p&&p.role==='user'&&!c.busy&&!c.closed&&!m.proj){var g=document.createElement('button');g.innerHTML=IC.ref+'Повторить';g.onclick=function(){var cc=cur();if(cc)regen(cc)};r.appendChild(g)}
  return r}
/*ACT-END*/
function syncBtn(){}
function dark(){var t=root.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function sync(){document.querySelectorAll('.th').forEach(function(b){b.innerHTML=dark()?IC.sun:IC.moon})}
try{var sv=localStorage.getItem('theme');if(sv)root.setAttribute('data-theme',sv)}catch(_){}
document.querySelectorAll('.th').forEach(function(b){b.onclick=function(){var n=dark()?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(_){}sync()}});
/*SAND-START*/
var cv=$('sand'),cx=cv.getContext('2d'),sandOn=true;try{sandOn=localStorage.getItem('sand')!=='off'}catch(_){}
var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
var HUES=[350,18,42,95,160,190,215,265,300],D=[],W=0,H=0,raf=0,lastT=0,rz;
function sandInit(){
  var r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;var G=Math.max(22,Math.min(30,Math.round(W/14)));
  cv.width=Math.round(W*r);cv.height=Math.round(H*r);cx.setTransform(r,0,0,r,0,0);
  D=[];for(var y=G/2;y<H+G;y+=G)for(var x=G/2;x<W+G;x+=G)D.push({x:x,y:y,c:'hsl('+HUES[Math.floor(Math.random()*HUES.length)]+',72%,58%)'});
  sandDraw(0)}
function sandDraw(t){
  cx.clearRect(0,0,W,H);
  var sg=Math.max(W,H)*.28,s2=2*sg*sg;
  var ax=W*(.5+.42*Math.sin(t*.7)),ay=H*(.28+.16*Math.sin(t*.5+1)),bx=W*(.5-.42*Math.sin(t*.7+.4)),by=H*(.72+.16*Math.sin(t*.45));
  for(var i=0;i<D.length;i++){var p=D[i],d1=(p.x-ax)*(p.x-ax)+(p.y-ay)*(p.y-ay),d2=(p.x-bx)*(p.x-bx)+(p.y-by)*(p.y-by);
    var I=Math.max(Math.exp(-d1/s2),Math.exp(-d2/s2));
    cx.globalAlpha=.2+.8*I;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,1.3+1.5*I,0,6.2832);cx.fill()}
  cx.globalAlpha=1}
function sandLoop(ts){raf=requestAnimationFrame(sandLoop);if(ts-lastT<33)return;lastT=ts;sandDraw(ts/1000)}
function sandRun(){cancelAnimationFrame(raf);raf=0;if(document.hidden||!sandOn||still||bgUrl)return;raf=requestAnimationFrame(sandLoop)}
addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){sandInit();sandRun()},200)});
document.addEventListener('visibilitychange',sandRun);
$('sandbtn').style.opacity=sandOn?1:.45;
$('sandbtn').onclick=function(){sandOn=!sandOn;try{localStorage.setItem('sand',sandOn?'on':'off')}catch(_){}$('sandbtn').style.opacity=sandOn?1:.45;sandRun();toast(sandOn?'Анимация фона включена':'Анимация фона выключена')};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){sync()});
sandInit();
/*SAND-END*/
/*BG-START*/
var bgUrl=null;
function setBg(u,cb){var el=$('bgimg');
  if(!u){bgUrl=null;el.innerHTML='';el.style.display='none';cv.style.display='';document.body.classList.remove('hasbg');sandRun();return}
  var im=new Image();im.alt='';
  im.onload=function(){bgUrl=u;el.innerHTML='';el.appendChild(im);var dm=document.createElement('div');dm.className='dim';el.appendChild(dm);el.style.display='block';cv.style.display='none';document.body.classList.add('hasbg');sandRun();if(cb)cb(true)};
  im.onerror=function(){if(cb)cb(false)};
  im.src=u}
function idb(){return new Promise(function(res,rej){if(!window.indexedDB)return rej();var q=indexedDB.open('ccai',1);q.onupgradeneeded=function(){q.result.createObjectStore('kv')};q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})}
function idbGet(k){return idb().then(function(db){return new Promise(function(res,rej){var r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})})}
function idbSet(k,v){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction('kv','readwrite'),s=t.objectStore('kv');if(v===null)s.delete(k);else s.put(v,k);t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
async function bgMenu(){
  var b=[{label:'Загрузить картинку или GIF',file:true}];if(bgUrl)b.push({label:'Убрать свой фон',val:'rm',cls:'danger'});b.push({label:'Отмена',val:null});
  var r=await modal({title:'Фон приложения',col:1,buttons:b});
  if(r.val==='file'&&r.file)loadBg(r.file);
  else if(r.val==='rm'){setBg(null);idbSet('bg',null).catch(function(){});toast('Фон убран')}}
$('bgbtn').onclick=bgMenu;
function loadBg(f){
  if(!f)return;toast('Читаю файл…');
  if(!/^image\//.test(f.type)&&!/\.(gif|png|jpe?g|webp)$/i.test(f.name||'')){toast('Выбери картинку или GIF');return}
  if(f.size>8*1024*1024){toast('Файл слишком большой, до 8 МБ');return}
  var fr=new FileReader();
  fr.onerror=function(){toast('Не удалось прочитать файл')};
  fr.onload=function(){var u=fr.result;if(u.indexOf('data:image')!==0)u='data:'+(f.type||'image/gif')+u.slice(u.indexOf(';'));
    setBg(u,function(ok){if(!ok){toast('Не удалось показать файл. Нужен другой GIF или картинка.');return}
      idbSet('bg',u).then(function(){toast('Фон установлен')}).catch(function(){toast('Фон установлен, но не сохранится после закрытия страницы')})})};
  fr.readAsDataURL(f)}
try{idbGet('bg').then(function(u){if(u)setBg(u)}).catch(function(){})}catch(_){}
/*BG-END*/
sync();
sandRun();
renderList();
if(!S.chats.length)newChat();else if(cur())open(S.cur);else show('listv');
if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
